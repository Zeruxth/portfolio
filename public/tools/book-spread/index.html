<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spread Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- a book's own type: Adobe Jenson in its optical sizes, Narkiss Tam for Hebrew (Adobe kit); Plex Mono from the portfolio for labels -->
<link rel="stylesheet" href="https://use.typekit.net/iui2oiq.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
  /* the panel is a cool violet with light type; the main actions and chosen options are solid white so they never sink into it.
     "Grey" turns the panel down to stone with dark actions. The book always sits on neutral graphite. */
  :root {
    --paper: #5b4ccf; --ink: #f7f5ff; --dim: rgba(247,245,255,.76); --faint: rgba(247,245,255,.52); --line: rgba(247,245,255,.22);
    --edge: rgba(247,245,255,.55); --tray: rgba(20,10,80,.22); --field: rgba(255,255,255,.12); --hover: rgba(255,255,255,.12);
    --accent: #ffffff; --on-accent: #3b2d9e; --cta-hover: #ece8ff; --em: #cdc5ff; --r: 10px;
    --stage: #33322f; --stage-line: #45443f; --mark: #7d7b75; --stage-ink: #c9c7c1; --stage-dim: #8a8882; --chip: rgba(51,50,47,.88);
    --serif: "adobe-jenson-pro", "narkiss-tam", Georgia, serif;
    --display: "adobe-jenson-pro-display", "narkiss-tam", Georgia, serif;
    --subhead: "adobe-jenson-pro-subhead", "narkiss-tam", Georgia, serif;
    --mono: "IBM Plex Mono", "narkiss-tam-condensed", ui-monospace, monospace;
  }
  :root[data-tone=grey] {
    --paper: #d9d8d3; --ink: #34332f; --dim: #6e6c67; --faint: #95938d; --line: #b8b6b0;
    --edge: #8f8d86; --tray: #cbcac4; --field: #e5e4e0; --hover: #cfcec9;
    --accent: #34332f; --on-accent: #eceae6; --cta-hover: #4a4844; --em: #6e6c67;
  }
  body, #panel, h1 em, .seg, .seg button, .btn, input[type=number] { transition: background-color .3s, color .3s, border-color .3s; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--serif);
         display: grid; grid-template-columns: minmax(0, 1fr) 328px; height: 100vh; overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }

  /* ---------- stage ---------- */
  #stage { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--stage); }
  #view { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: grab; }
  #view.grabbing { cursor: grabbing; }
  #frame { position: relative; transform-origin: center center; will-change: transform; }
  canvas#cv { display: block; }
  /* crop marks sit just outside the canvas, like a proof */
  .crop { position: absolute; width: 18px; height: 18px; pointer-events: none; }
  .crop::before, .crop::after { content: ""; position: absolute; background: var(--mark); }
  .crop::before { width: 14px; height: 1px; } .crop::after { width: 1px; height: 14px; }
  .crop.tl { left: -22px; top: -22px; } .crop.tl::before { top: 18px; left: 0; } .crop.tl::after { left: 18px; top: 0; }
  .crop.tr { right: -22px; top: -22px; } .crop.tr::before { top: 18px; right: 0; } .crop.tr::after { right: 18px; top: 0; }
  .crop.bl { left: -22px; bottom: -22px; } .crop.bl::before { bottom: 18px; left: 0; } .crop.bl::after { left: 18px; bottom: 0; }
  .crop.br { right: -22px; bottom: -22px; } .crop.br::before { bottom: 18px; right: 0; } .crop.br::after { right: 18px; bottom: 0; }
  #stage.drag::after { content: ""; position: absolute; inset: 14px; border: 1px dashed var(--mark); pointer-events: none; z-index: 3; }
  #empty { color: var(--stage-dim); text-align: center; max-width: 320px; }
  #empty b { display: block; color: var(--stage-ink); font: 400 28px var(--display); line-height: 1.2; margin-bottom: 6px; }
  .chip { position: absolute; z-index: 2; display: flex; align-items: center; gap: 2px; padding: 3px;
          background: var(--chip); border: 1px solid var(--stage-line); border-radius: var(--r); color: var(--stage-ink); }
  #hud { bottom: 12px; inset-inline-start: 12px; }
  #hud button { background: none; border: 0; border-radius: 7px; height: 24px; min-width: 26px; padding: 0 7px; cursor: pointer; color: var(--stage-ink);
                font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  #hud button:hover { color: #fff; background: rgba(255,255,255,.08); }
  #hud .z { font: 11px var(--mono); min-width: 46px; text-align: center; color: var(--stage-dim); }
  #dims { top: 12px; inset-inline-start: 12px; padding: 3px 8px; font: 11px var(--mono); color: var(--stage-dim); }

  #strip { flex: none; display: flex; gap: 10px; padding: 10px 16px 8px; overflow-x: auto; border-top: 1px solid var(--stage-line); background: var(--stage); }
  #strip:empty { display: none; }
  .th { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; }
  .th canvas { display: block; height: 52px; width: auto; border-radius: 4px; outline: 1px solid var(--stage-line); outline-offset: 2px; opacity: .5; }
  .th span { font: italic 13px var(--serif); color: var(--stage-dim); }
  .th[aria-current=true] canvas { opacity: 1; outline-color: var(--stage-ink); }
  .th[aria-current=true] span { color: var(--stage-ink); }

  /* ---------- panel: set like a colophon ---------- */
  #panel { overflow-y: auto; padding: 22px 24px 32px; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  h1 { font: 400 40px/1 var(--display); letter-spacing: -.01em; white-space: nowrap; }
  h1 em { font-style: italic; color: var(--em); }
  :lang(he) h1 em { font-style: normal; }
  .sub { color: var(--dim); font-size: 15px; line-height: 1.4; margin-top: 10px; max-width: 24ch; }
  .hctl { flex: none; display: flex; gap: 12px; align-items: center; margin-top: 4px; }
  .hbtn { background: none; border: 0; border-bottom: 1px solid var(--ink); height: 22px; padding: 0 2px; font: 500 11px var(--mono);
          text-transform: uppercase; letter-spacing: .06em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .hbtn:hover { color: var(--dim); border-color: var(--dim); }
  #tone::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--em); transition: background-color .3s; }

  section { border-top: 1px solid var(--line); padding: 14px 0 18px; }
  /* a running head: the title on the reading side, the folio on the far one */
  h2 { display: flex; gap: 10px; align-items: baseline; font: 400 24px/1.1 var(--subhead); margin-bottom: 14px; }
  h2 .n { order: 2; margin-inline-start: auto; font: 11px var(--mono); color: var(--faint); }
  .field { margin-bottom: 14px; }
  .lab { display: flex; justify-content: space-between; align-items: baseline; font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin-bottom: 6px; }
  .lab output { font: 11px var(--mono); color: var(--ink); letter-spacing: 0; }
  .help { font-size: 14px; color: var(--dim); margin-top: 6px; line-height: 1.4; }
  .note { font-size: 14px; font-style: italic; color: var(--dim); margin-top: 8px; line-height: 1.4; }
  :lang(he) .note { font-style: normal; }
  /* Hebrew labels have no capitals to carry them, so they sit a size up */
  :lang(he) .lab, :lang(he) details summary, :lang(he) .btn, :lang(he) .inline { font-family: "narkiss-tam-condensed", sans-serif; font-size: 14px; letter-spacing: .02em; }
  :lang(he) .lab output, :lang(he) .inline input { font-family: var(--mono); }
  /* in Hebrew, Narkiss Tam leads the stack instead of waiting behind Jenson for missing glyphs */
  :lang(he) { --serif: "narkiss-tam", "adobe-jenson-pro", sans-serif; --display: "narkiss-tam", "adobe-jenson-pro-display", sans-serif;
              --subhead: "narkiss-tam", "adobe-jenson-pro-subhead", sans-serif; }
  /* Narkiss Tam runs larger than Jenson: Hebrew text sits a step down */
  :lang(he) body { font-size: 14px; } :lang(he) h1 { font-size: 34px; } :lang(he) h2 { font-size: 21px; }
  :lang(he) .help, :lang(he) .note, :lang(he) .sub { font-size: 13px; } :lang(he) .seg button, :lang(he) label.chk { font-size: 14px; }

  .btn { display: block; width: 100%; height: 38px; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); border-radius: var(--r); cursor: pointer;
         font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .07em; }
  .btn:hover { background: var(--cta-hover); border-color: var(--cta-hover); }
  .btn.ghost { background: none; color: var(--ink); border-color: var(--edge); }
  .btn.ghost:hover { background: var(--hover); border-color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost:disabled:hover { background: none; border-color: var(--edge); }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .row .btn { white-space: nowrap; padding: 0 6px; letter-spacing: .03em; }

  /* the chosen option is lifted a shade and underlined, not inverted */
  /* a tray of options; the chosen one is a pill in the accent colour */
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--tray); border-radius: var(--r); }
  .seg button { flex: 1; height: 28px; background: none; border: 0; border-radius: 7px; cursor: pointer;
                font-size: 15px; color: var(--dim); padding: 0 4px; white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }

  label.chk { display: flex; gap: 9px; align-items: flex-start; font-size: 15px; cursor: pointer; margin-bottom: 9px; }
  label.chk input { accent-color: var(--accent); margin-top: 4px; }
  .inline { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--dim); margin: 2px 0 0; }
  input[type=number] { width: 58px; height: 28px; background: var(--field); border: 1px solid var(--edge); border-radius: 7px; text-align: center; font: 12px var(--mono); }

  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; background: none; height: 14px; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 1px; background: var(--edge); }
  input[type=range]::-moz-range-track { height: 2px; border-radius: 1px; background: var(--edge); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--accent); border: 2px solid var(--paper); margin-top: -6px; border-radius: 50%; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--accent); border: 2px solid var(--paper); border-radius: 50%; }

  .swatches { display: flex; gap: 6px; align-items: center; }
  .sw { width: 28px; height: 28px; border: 1px solid rgba(0,0,0,.12); border-radius: 50%; cursor: pointer; padding: 0; }
  .sw[aria-pressed=true] { outline: 1.5px solid var(--accent); outline-offset: 2px; }
  .sw.custom { position: relative; overflow: hidden; background: conic-gradient(#c8695a, #cdb76a, #7fa07a, #6f9aa3, #7a77a8, #a8739a, #c8695a); }
  .sw.custom input { position: absolute; inset: -6px; opacity: 0; cursor: pointer; }

  details summary { cursor: pointer; font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--dim); list-style: none; padding: 4px 0; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "+ "; }
  details[open] summary::before { content: "− "; }
  details summary:hover { color: var(--ink); }
  details .inner { padding-top: 10px; }

  #status { font: italic 14px var(--serif); color: var(--dim); min-height: 18px; margin-top: 10px; }
  #nav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  #nav button { width: 34px; height: 28px; background: none; border: 1px solid var(--edge); border-radius: 7px; cursor: pointer; font-size: 16px; }
  #nav button:hover { border-color: var(--ink); background: var(--hover); }
  #count { flex: 1; text-align: center; font: italic 16px var(--serif); color: var(--dim); }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; overflow: auto; }
    #panel { border-inline-start: 0; border-top: 1px solid var(--line); overflow: visible; padding: 18px 16px; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="view">
    <div id="empty"><b data-i="empty"></b><span data-i="emptySub"></span></div>
    <div id="frame" hidden>
      <canvas id="cv"></canvas>
      <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
    </div>
    <div class="chip" id="dims" dir="ltr" hidden></div>
    <div class="chip" id="hud" hidden>
      <button id="zOut" aria-label="−">−</button><div class="z" id="zVal">100%</div><button id="zIn" aria-label="+">+</button>
      <button id="zFit" data-i="fit"></button><button id="z100">1:1</button>
    </div>
  </div>
  <div id="strip"></div>
</div>

<aside id="panel">
  <header>
    <div><h1><span data-i="titleA"></span> <em data-i="titleB"></em></h1><p class="sub" data-i="sub"></p></div>
    <div class="hctl"><button id="tone" class="hbtn"></button><button id="lang" class="hbtn"></button></div>
  </header>

  <section>
    <h2><span class="n">01</span><span data-i="s1"></span></h2>
    <button class="btn" id="pick" data-i="open"></button>
    <p class="note" id="sampleNote" data-i="sampleNote"></p>
    <div id="srcGrp" style="margin-top:14px">
      <div class="field">
        <div class="lab"><span data-i="dir"></span></div>
        <div class="seg"><button id="dRtl" data-i="rtl"></button><button id="dLtr" data-i="ltr"></button></div>
        <p class="help" data-i="dirHelp"></p>
      </div>
      <div class="field">
        <div class="lab"><span data-i="source"></span></div>
        <div class="seg"><button id="sAuto" data-i="auto"></button><button id="sSpread" data-i="spreads"></button><button id="sSingle" data-i="singles"></button></div>
        <p class="help" id="detNote"></p>
      </div>
      <label class="chk"><input type="checkbox" id="trim"><span><span data-i="trim"></span><span class="help" style="display:block;margin-top:1px" data-i="trimHelp"></span></span></label>
      <label class="chk"><input type="checkbox" id="bleedOn"><span data-i="bleed"></span></label>
      <div class="inline"><input type="number" id="bleed" value="3" min="0" max="20" step="0.5"><span data-i="mm"></span> · <input type="number" id="dpi" value="300" min="72" max="1200"> DPI</div>
      <p class="help" data-i="dpiHelp"></p>
    </div>
  </section>

  <section>
    <h2><span class="n">02</span><span data-i="s2"></span></h2>
    <div class="field">
      <div class="lab"><span data-i="preset"></span></div>
      <div class="seg" id="presets"><button data-p="flat" data-i="flat"></button><button data-p="soft" data-i="soft"></button><button data-p="deep" data-i="deep"></button></div>
    </div>
    <div class="field">
      <div class="lab"><span data-i="view"></span></div>
      <div class="seg"><button id="vFlat" data-i="straight"></button><button id="vAngle" data-i="angled"></button></div>
    </div>
    <div class="field">
      <div class="lab"><span data-i="show"></span></div>
      <div class="seg"><button id="dSpread" data-i="spreadV"></button><button id="dSingle" data-i="singleV"></button></div>
      <label class="chk" id="coverWrap" style="margin-top:8px"><input type="checkbox" id="cover" checked><span data-i="cover"></span></label>
    </div>
    <div class="field">
      <div class="lab"><span data-i="surface"></span></div>
      <div class="swatches" id="bgs"></div>
    </div>
    <details>
      <summary data-i="fine"></summary>
      <div class="inner" id="sliders"></div>
    </details>
  </section>

  <section>
    <h2><span class="n">03</span><span data-i="s3"></span></h2>
    <div class="row" style="margin-bottom:6px"><button class="btn ghost" id="dl" data-i="png" disabled></button><button class="btn ghost" id="dlAll" data-i="zip" disabled></button></div>
    <div class="field" style="margin-top:14px">
      <div class="lab"><span data-i="transition"></span></div>
      <div class="seg" id="trans"><button data-t="cut" data-i="cut"></button><button data-t="fade" data-i="fade"></button><button data-t="slide" data-i="slide"></button><button data-t="turn" data-i="turn"></button></div>
    </div>
    <div class="field">
      <div class="lab"><span data-i="hold"></span><output id="vH">2.0s</output></div>
      <input type="range" id="hd" min="5" max="80" value="20">
    </div>
    <div class="field">
      <div class="seg" id="res"><button data-h="720">720p</button><button data-h="1080">1080p</button><button data-h="1440">1440p</button></div>
    </div>
    <div class="row"><button class="btn ghost" id="play" data-i="preview"></button><button class="btn" id="rec" data-i="rec" disabled></button></div>
    <p class="note" id="fmtNote"></p>
    <div id="nav"><button id="prev" aria-label="previous">‹</button><div id="count" dir="ltr">—</div><button id="next" aria-label="next">›</button></div>
    <div id="status" role="status"></div>
  </section>
</aside>

<script>

    bleed: "הורדת בליד", mm: "מ״מ", dpiHelp: "ה־DPI רלוונטי רק לתמונות; ב־PDF הגודל נלקח מהקובץ.",

/* ---------- preview ---------- */
function preview() {

  compose(ctx, nativeWidth(), views[cur]);
  const d = cv.width + "×" + cv.height;
  $("#dims").textContent = d + " px";
  $("#count").textContent = (cur + 1) + " / " + views.length;

}
function viewLabel(v) {

  views.forEach((v, i) => {
    const c = document.createElement("canvas"), g = c.getContext("2d");
    const keep = { pd: S.pd, gn: S.gn }; S.pd = 4; S.gn = 0;
    compose(g, 220, v); Object.assign(S, keep);
    const b = document.createElement("button"); b.className = "th"; b.setAttribute("aria-current", i === cur);
    b.appendChild(c); const s = document.createElement("span"); s.textContent = viewLabel(v); b.appendChild(s);
    b.onclick = () => go(i); st.appendChild(b);

}
function markThumb() {
  [...$("#strip").children].forEach((x, j) => x.setAttribute("aria-current", j === cur));
  const el = $("#strip").children[cur]; if (el) el.scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* ---------- images ---------- */
const nameOf = i => (S.disp === "single" ? "page-" : "spread-") + String(i + 1).padStart(2, "0") + ".png";
function pngOf(i) {
  return new Promise(res => { const c = document.createElement("canvas"); compose(c.getContext("2d"), nativeWidth(), views[i]); c.toBlob(res, "image/png"); });
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$("#dl").onclick = async () => download(await pngOf(cur), nameOf(cur));
$("#dlAll").onclick = async () => {
  if (busy) return; busy = true;
  const zip = new JSZip();
  for (let i = 0; i < views.length; i++) { say("saving", { a: i + 1, b: views.length }); zip.file(nameOf(i), await pngOf(i)); }
  download(await zip.generateAsync({ type: "blob" }), "spreads.zip");

};

/* ---------- video ---------- */
const TR = 700;   // transition length in ms, taken from the end of each spread's hold
const turnBuf = document.createElement("canvas");

// While a video renders, each spread is drawn once and reused: a held spread is the same picture every frame.

function cached(i, W, clear) {

}

$("#play").onclick = () => {
  if (busy || !views.length) return;
  busy = true; cache = new Map(); const t0 = performance.now(), total = S.hold * views.length, W = nativeWidth();
  (function step() {
    const e = performance.now() - t0;
    if (e >= total) { busy = false; cache = null; preview(); return; }
    frameAt(ctx, W, e); requestAnimationFrame(step);

};
const canFast = () => "VideoEncoder" in window && window.Mp4Muxer;
function pickMime() {
  for (const m of ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm"]) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return null;
}
function showFmt() {
  const m = pickMime();
  $("#fmtNote").textContent = canFast() ? t("fast") : m ? t("slow", { f: m.includes("mp4") ? "MP4" : "WebM" }) : t("novideo");
}
function videoSize() { const { H } = layout(1000); let W = Math.round(1000 * S.vh / H); W += W % 2; let H2 = S.vh; H2 += H2 % 2; return { W, H: H2 }; }

$("#rec").onclick = async () => {
